<style>
/* Layout: matchday-programme console — sticky scoreboard header, left rail nav (bottom rail on phones), dense data panels. */
:root {
  --bg: #eceee7; --panel: #ffffff; --panel2: #f4f6f0; --ink: #17201b; --muted: #5d6a62; --line: #d7ddd3;
  --accent: #136f43; --accent-2: #0d5533; --accent-ink: #ffffff; --chalk: #f8faf5;
  --gold: #b88a00; --win: #1c8a4c; --draw: #7d847f; --loss: #c2392f; --warn: #b86e00; --info: #2c6aa8;
  --pitch: #2f7d4b; --pitch-2: #2a7245; --pitch-line: rgba(255,255,255,.55);
  --shadow: 0 1px 2px rgba(20,30,24,.06), 0 4px 16px rgba(20,30,24,.06);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1310; --panel: #141c18; --panel2: #1a241f; --ink: #e5ebe7; --muted: #92a098; --line: #263129;
  --accent: #3dbb7a; --accent-2: #5bd394; --accent-ink: #04140b; --chalk: #18221d;
  --gold: #e3b62e; --win: #3dbb7a; --draw: #8d958f; --loss: #ec6a5f; --warn: #e2a13a; --info: #6aa7e6;
  --pitch: #1f5a36; --pitch-2: #1c5232; --pitch-line: rgba(255,255,255,.35);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1310; --panel: #141c18; --panel2: #1a241f; --ink: #e5ebe7; --muted: #92a098; --line: #263129;
  --accent: #3dbb7a; --accent-2: #5bd394; --accent-ink: #04140b; --chalk: #18221d;
  --gold: #e3b62e; --win: #3dbb7a; --draw: #8d958f; --loss: #ec6a5f; --warn: #e2a13a; --info: #6aa7e6;
  --pitch: #1f5a36; --pitch-2: #1c5232; --pitch-line: rgba(255,255,255,.35);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 2.2rem; } h2 { font-size: 1.45rem; } h3 { font-size: 1.15rem; } h4 { font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
a { color: var(--accent); }
.num, td, .tab { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.disp { font-family: var(--f-display); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* app frame */
#app { min-height: 100%; }
.frame { display: grid; grid-template-columns: 208px minmax(0,1fr); grid-template-rows: auto 1fr; min-height: 100vh; min-height: 100dvh; }
.topbar { grid-column: 1 / -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.topbar .club { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar .club .nm { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .date { margin-left: auto; text-align: right; line-height: 1.15; }
.topbar .date b { font-family: var(--f-display); font-size: 1.1rem; display: block; }
.rail { background: var(--panel); border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 61px; height: calc(100dvh - 61px); overflow-y: auto; }
.rail button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--muted); }
.rail button svg { width: 18px; height: 18px; flex: none; }
.rail button:hover { background: var(--panel2); color: var(--ink); }
.rail button.on { background: var(--accent); color: var(--accent-ink); }
.rail .badge-n { margin-left: auto; background: var(--loss); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 6px; font-weight: 700; }
.rail .sep { height: 1px; background: var(--line); margin: 8px 4px; }
main { padding: 20px 22px 60px; min-width: 0; }
.page-h { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { background: var(--accent-2); }
.btn.go { font-family: var(--f-display); font-size: 1.15rem; letter-spacing: .04em; text-transform: uppercase; padding: 8px 22px; }
.btn.go.ff { padding: 8px 12px; }
.cab { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cabitem { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 12px 8px; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(180deg, color-mix(in srgb, var(--gold, #c9a227) 12%, transparent), transparent); }
.cabicon { font-size: 2rem; line-height: 1; position: relative; }
.ig { max-width: 520px; margin: 0 auto; }
.igtop { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; }
.iglogo { font-family: "Brush Script MT", "Segoe Script", cursive; font-size: 1.9rem; font-weight: 700; letter-spacing: .01em; }
.igstories { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 12px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.igst { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; min-width: 62px; }
.igst .small { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.igring { display: inline-flex; padding: 2px; border-radius: 50%; background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); }
.igring > * { border: 2px solid var(--panel); border-radius: 50%; }
.igring.me { background: var(--line); } .igring.rv { background: linear-gradient(45deg, #c2392f, #7a1f1f); }
.igav { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--bg); font-size: 18px; }
.igav.big { width: 54px; height: 54px; font-size: 26px; }
.igp { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.igh { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.igv { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; background: #3897f0; color: #fff; font-size: 9px; font-weight: 800; vertical-align: middle; }
.igimg { position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 0; }
.igem { position: absolute; top: 10%; right: 9%; font-size: clamp(36px, 12vw, 64px); filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
.igface { width: 56%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); background: #fff2; }
.igface svg, .igface img { width: 100%; height: 100%; display: block; object-fit: cover; }
.igcrest { transform: scale(1.1); }
.igsc { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); background: rgba(0,0,0,.65); color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; padding: 4px 14px; border-radius: 999px; white-space: nowrap; }
.igact { display: flex; gap: 14px; padding: 8px 12px 2px; }
.igact button { background: none; border: 0; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--ink); padding: 0; }
.iglike.on { color: #ed4956; }
.igbody { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.iglink { background: none; border: 0; padding: 0; color: var(--muted, #7d847f); cursor: pointer; text-align: left; font: inherit; font-size: .85rem; }
.igprof { display: flex; gap: 18px; align-items: center; margin-bottom: 16px; }
.igcounts { gap: 16px; margin: 6px 0; }
.iggrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.igthumb { position: relative; } .igthumb .igem { font-size: 22px; } .igthumb .igsc { font-size: .6rem; padding: 2px 6px; }
.igthumb > .small { position: absolute; left: 6px; bottom: 4px; color: #fff; font-weight: 700; text-shadow: 0 1px 3px #000; }
.igtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.igtile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; color: inherit; text-align: center; }
.igtile span:first-child { font-size: 1.6rem; } .igtile.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); } .igtile:disabled { opacity: .45; cursor: not-allowed; }
.cabicon span { position: absolute; right: -18px; bottom: -2px; font-size: .8rem; font-weight: 800; }
.btn.danger { color: var(--loss); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--panel); }
input[type=text], input[type=number], select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input[type=color] { width: 44px; height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--panel); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
label.f > input, label.f > select { text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 14px; font-weight: 400; }

/* panels */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g21 { grid-template-columns: minmax(0,2fr) minmax(0,1fr); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.panel > h3, .panel > h4 { margin-bottom: 10px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.chip.w { background: var(--win); color: #fff; border-color: transparent; }
.chip.d { background: var(--draw); color: #fff; border-color: transparent; }
.chip.l { background: var(--loss); color: #fff; border-color: transparent; }
.chip.inj { color: var(--loss); border-color: var(--loss); }
.chip.sus { color: var(--warn); border-color: var(--warn); }
.chip.gold { color: var(--gold); border-color: var(--gold); }
.pos { display: inline-block; min-width: 30px; text-align: center; font-weight: 700; font-size: 11px; padding: 2px 5px; border-radius: 5px; color: #fff; font-family: var(--f-display); letter-spacing: .04em; }
.pos.GK { background: #b8860b; } .pos.DEF { background: #2c6aa8; } .pos.MID { background: #1c8a4c; } .pos.ATT { background: #c2392f; }
.ovr { display: inline-grid; place-items: center; min-width: 30px; height: 24px; border-radius: 6px; font-family: var(--f-display); font-weight: 700; font-size: 15px; color: #fff; padding: 0 4px; }
.formdots { display: inline-flex; gap: 3px; }
.formdots i { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 10px; font-style: normal; font-weight: 700; color: #fff; }
.formdots i.W { background: var(--win); } .formdots i.D { background: var(--draw); } .formdots i.L { background: var(--loss); }
.bar { height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter { display: flex; align-items: center; gap: 8px; }
.meter .bar { flex: 1; }

/* tables */
.tw { overflow-x: auto; margin: 0 -4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
table.t th.s { cursor: pointer; } table.t th.s:hover { color: var(--ink); }
table.t td { padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--panel2); }
table.t tr.me td { background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 600; }
table.t td.r, table.t th.r { text-align: right; }
table.t td.c, table.t th.c { text-align: center; }
.zone { border-left: 3px solid transparent; }
.zone.ucl { border-left-color: var(--info); } .zone.uel { border-left-color: var(--warn); } .zone.up { border-left-color: var(--win); } .zone.po { border-left-color: color-mix(in srgb, var(--win) 50%, transparent); } .zone.down { border-left-color: var(--loss); }
.pcell { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pcell .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }

/* faces & badges */
.face { flex: none; border-radius: 50%; overflow: hidden; background: var(--panel2); display: inline-block; position: relative; }
.face img, .face svg { width: 100%; height: 100%; display: block; object-fit: cover; }
.crest { flex: none; display: inline-block; }

/* home */
.nextmatch { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center; padding: 8px 0; }
.nextmatch .tm { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; min-width: 0; }
.nextmatch .vs { font-family: var(--f-display); font-size: 2rem; font-weight: 800; color: var(--muted); }
.msg { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.msg:last-child { border-bottom: 0; }
.msg .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }
.msg.read .dot { background: transparent; }
.msg .tt { font-weight: 600; }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-family: var(--f-display); font-size: 1.6rem; line-height: 1; }
.kpi span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; }

/* pitch */
.pitch { position: relative; aspect-ratio: 68/90; max-width: min(100%, 500px); margin: 0 auto; width: 100%; background: repeating-linear-gradient(0deg, var(--pitch) 0 9%, var(--pitch-2) 9% 18%); border-radius: 12px; overflow: hidden; border: 2px solid var(--pitch-line); }
.pitch .lines { position: absolute; inset: 0; pointer-events: none; }
.slot { position: absolute; transform: translate(-50%, 50%); display: flex; flex-direction: column; align-items: center; gap: 2px; width: 84px; cursor: pointer; border: 0; background: none; padding: 0; color: #fff; }
.slot .nm { font-size: 11px; font-weight: 700; background: rgba(0,0,0,.55); padding: 1px 6px; border-radius: 4px; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .ps { font-size: 10px; font-weight: 700; font-family: var(--f-display); letter-spacing: .05em; opacity: .9; }
.slot.sel .face { outline: 3px solid #ffd84a; }
.slot .warn { position: absolute; top: -4px; right: 14px; background: var(--loss); color: #fff; border-radius: 99px; font-size: 10px; padding: 0 5px; font-weight: 700; }

/* modals */
.scrim { position: fixed; inset: 0; background: rgba(8,14,10,.55); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px 16px; overflow-y: auto; }
.modal { background: var(--panel); border-radius: 14px; border: 1px solid var(--line); width: min(860px, 100%); box-shadow: var(--shadow); margin: 20px 0; }
.modal.wide { width: min(1100px, 100%); }
.modal-h { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-h .x { margin-left: auto; }
.modal-b { padding: 16px 18px; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; z-index: 80; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* player profile */
.prof-top { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 18px; align-items: center; }
.attr { display: grid; grid-template-columns: 44px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; }
.attr .bar { height: 8px; }

/* live match */
.score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; padding: 16px 18px; background: var(--ink); color: var(--panel); border-radius: 14px 14px 0 0; }
.score .tn { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; display: flex; align-items: center; gap: 10px; min-width: 0; }
.score .tn.a { justify-content: flex-end; text-align: right; }
.score .sc { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; letter-spacing: .04em; text-align: center; line-height: 1; }
.score .mn { font-size: 13px; text-align: center; opacity: .8; font-weight: 600; }
.feed { max-height: 360px; overflow-y: auto; display: flex; flex-direction: column; }
.ev { display: grid; grid-template-columns: 40px 22px 1fr; gap: 8px; padding: 7px 4px; border-bottom: 1px solid var(--line); align-items: start; }
.ev .m { font-family: var(--f-display); font-weight: 700; color: var(--muted); }
.ev.goal { background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; }
.ev.big { font-family: var(--f-display); font-size: 1.1rem; text-transform: uppercase; letter-spacing: .05em; justify-content: center; }
.statrow { display: grid; grid-template-columns: 40px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; margin: 6px 0; }
.statrow .lab { text-align: center; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
.duel { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--panel2); }
.duel i { display: block; height: 100%; }
.momentum { display: flex; height: 26px; gap: 1px; align-items: center; }
.momentum i { flex: 1; display: block; border-radius: 1px; }

/* start screen */
.start { max-width: 1060px; margin: 0 auto; padding: 32px 18px 60px; }
.hero { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: 24px; align-items: center; margin-bottom: 28px; }
.hero h1 { font-size: clamp(2.6rem, 7vw, 4.6rem); font-weight: 800; line-height: .92; text-transform: uppercase; letter-spacing: -.005em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { font-size: 1.05rem; color: var(--muted); max-width: 52ch; }
.savecard { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
.choice:hover { border-color: var(--accent); }
.choice h3 { font-size: 1.4rem; }
.clublist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.clubpick { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; text-align: left; }
.clubpick:hover, .clubpick.on { border-color: var(--accent); background: var(--panel2); }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 12px; }
.editgrid { display: grid; grid-template-columns: 52px minmax(0,1fr) minmax(0,1fr) 92px; gap: 6px; align-items: center; }
.editgrid input { width: 100%; }

.empty { padding: 24px; text-align: center; color: var(--muted); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; }
.trophy { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.loading { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); z-index: 90; font-family: var(--f-display); font-size: 1.4rem; font-weight: 700; }

@media (max-width: 980px) { .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g21 { grid-template-columns: minmax(0,1fr); } .hero { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 820px) {
  .frame { grid-template-columns: minmax(0,1fr); }
  .rail { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; flex-direction: row; overflow-x: auto; z-index: 30; border-right: 0; border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 4px; }
  .rail button { flex-direction: column; gap: 2px; font-size: 10px; padding: 6px 8px; width: auto; flex: none; min-width: 62px; align-items: center; text-align: center; }
  .rail .sep { display: none; }
  .rail .badge-n { position: absolute; margin: 0 0 0 18px; }
  main { padding: 14px 16px 110px; }
  .topbar { padding: 8px 16px; gap: 10px; }
  .topbar .club .nm { font-size: 1.05rem; }
  .topbar .date span, .topbar .club .small { display: none; }
  .topbar .date b { font-size: .95rem; }
  .btn.go { padding: 8px 14px; font-size: 1rem; }
  .g2, .g3 { grid-template-columns: minmax(0,1fr); }
  .prof-top { grid-template-columns: auto minmax(0,1fr); }
  .prof-top > :last-child { grid-column: 1 / -1; }
  .score .sc { font-size: 2rem; } .score .tn { font-size: 1rem; }
  .editgrid { grid-template-columns: 44px minmax(0,1fr) minmax(0,1fr); }
  .editgrid .nat { display: none; }
  .hide-sm { display: none !important; }
}
.moment { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); border-radius: 12px; padding: 14px 16px; }
.moment.done { border-width: 1px; padding: 10px 14px; }
.moment.done.good { border-color: var(--win); } .moment.done.bad { border-color: var(--loss); background: color-mix(in srgb, var(--loss) 8%, var(--panel)); }
.moment .btn { font-size: 1rem; padding: 10px 16px; }
.facrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.facrow:last-child { border-bottom: 0; }
.brand { display: inline-block; padding: 3px 10px; border-radius: 6px; font-weight: 800; font-size: 13px; letter-spacing: .02em; border: 1px solid var(--line); }
.code { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; letter-spacing: .06em; padding: 2px 10px; border: 1px dashed var(--accent); border-radius: 8px; user-select: all; }
.friend { display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); cursor: pointer; }
.friend:hover, .friend.on { border-color: var(--accent); background: var(--panel2); }
.chat-scroll { height: min(56vh, 520px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 2px; }
.bub { max-width: 78%; align-self: flex-start; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 8px 12px; overflow-wrap: anywhere; }
.bub.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-color: transparent; border-radius: 14px 14px 4px 14px; }
.bub span { display: block; font-size: 10px; opacity: .7; margin-top: 3px; }
.traits { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.trait { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }
.trait:hover, .trait.on { border-color: var(--accent); background: var(--panel2); }
.tracker { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #10301f; }
.ads { overflow: hidden; white-space: nowrap; background: #0b0f0d; padding: 3px 0; }
.ads-run { display: inline-flex; gap: 4px; animation: adsrun 38s linear infinite; }
.adb { display: inline-block; font-family: var(--f-display); font-weight: 800; font-size: 12px; letter-spacing: .08em; padding: 3px 14px; border-radius: 2px; }
.adb img { height: 14px; vertical-align: middle; display: inline-block; }
.ad-ar { font-family: system-ui, sans-serif; font-weight: 700; letter-spacing: 0; margin-inline-start: 6px; }
.ad-metro { text-transform: none; letter-spacing: .02em; font-size: 14px; padding: 2px 16px; }
.ad-koshk { border-left: 4px solid #1f7a3a; border-right: 4px solid #1f7a3a; }
@keyframes adsrun { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.tpitch { position: relative; aspect-ratio: 105/58; max-height: 300px; width: 100%; background: repeating-linear-gradient(90deg, #2f7d4b 0 10%, #2a7245 10% 20%); }
.tpitch .lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.tpitch .lines g { stroke: rgba(255,255,255,.55); }
.tball { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.25), 0 1px 3px rgba(0,0,0,.5); transition: left .45s ease, top .45s ease; }
.tshot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; border: 2px solid; opacity: .85; }
.tshot.miss, .tshot.block { border-style: dashed; opacity: .6; }
.tzone { position: absolute; top: 0; bottom: 0; width: 30%; pointer-events: none; }
.tlabel { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: rgba(0,0,0,.6); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.tlabel.goal { background: #f2c230; color: #111; font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; }
.headline { display: flex; flex-direction: column; gap: 1px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.headline b { font-family: var(--f-display); font-size: 1.05rem; }
.kid { padding: 10px 0; border-bottom: 1px solid var(--line); }
.kid:last-child { border-bottom: 0; }
.lvl { color: var(--accent); letter-spacing: 1px; font-size: 11px; margin-left: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
